<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    :root {
        --amz-dark: #131921;
        --amz-orange: #febd69;
    }

    header { 
        background: var(--amz-dark); 
        color: white; 
        padding: 0.5rem 4%; 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        position: sticky; 
        top: 0; 
        z-index: 1000; 
        height: 60px;
    }

    .logo { font-size: 1.4rem; font-weight: bold; color: #fff; text-decoration: none; }
    .logo span { color: var(--amz-orange); }

    .header-actions { display: flex; align-items: center; gap: 20px; position: relative; }

    /* Account Trigger Btn */
    .nav-account-btn {
        background: none;
        border: none;
        color: white;
        text-align: left;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        padding: 5px;
    }
    .nav-account-btn .line-1 { font-size: 11px; color: #ccc; pointer-events: none; }
    .nav-account-btn .line-2 { font-size: 14px; font-weight: bold; pointer-events: none; }

    /* The Dropdown Div */
    #accountMenu {
        display: none; /* Controlled by JS */
        position: absolute;
        top: 55px;
        right: 0;
        background: white;
        width: 400px; 
        border-radius: 4px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        color: #111;
        padding: 20px;
        z-index: 2000;
    }

    .dropdown-cols { display: flex; gap: 30px; }
    .drop-col { flex: 1; }
    .drop-col h3 { font-size: 15px; margin-bottom: 10px; color: #111; border-bottom: 1px solid #eee; }
    .drop-col ul { list-style: none; padding: 0; margin: 0; }
    .drop-col ul li { margin: 10px 0; }
    .drop-col ul li a { color: #444; text-decoration: none; font-size: 13px; display: block; }
    .drop-col ul li a:hover { color: #e47911; text-decoration: underline; }

    .close-drop {
        display: block;
        text-align: right;
        font-size: 18px;
        font-weight: bold;
        color: #999;
        cursor: pointer;
        margin-bottom: 10px;
    }
    .close-drop:hover { color: #333; }
</style>
</head>
<body>
    <header>
    <a href="index.html" class="logo">UTTAM<span>HUB</span></a>

    <div class="header-actions">
       

        <a href="#contact" style="background:var(--amz-orange); color:#111; padding:8px 15px; text-decoration:none; border-radius:3px; font-weight:bold; font-size:0.8rem;">Contact Us</a>
    </div>
</header>


</body>
</html>
