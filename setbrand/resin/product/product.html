<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Uttamhub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="stylesheet" href="product css/add-btn-kit.css">
    <link rel="stylesheet" href="product css/core-header.css">
    <link rel="stylesheet" href="product css/des-similar.css">
    <link rel="stylesheet" href="product css/responsive.css">
    <link rel="stylesheet" href="product css/main-image-thum-img.css">
    <link rel="stylesheet" href="product css/product-detail-varient.css">
    
    <link rel="stylesheet" href="../../../shopcart.css">

    <style>
        /* --- Search Bar & Cart CSS --- */
        .glass-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 10px 15px;
            border-bottom: 1px solid #eee;
        }
        .header-inner {
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .search-bar {
            flex: 1;
            position: relative;
            background: #f1f1f1;
            border-radius: 8px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
        }
        .search-bar input {
            background: transparent;
            border: none;
            outline: none;
            width: 100%;
            margin-left: 8px;
            font-size: 0.9rem;
        }
        .search-results-overlay {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border-radius: 0 0 12px 12px;
            max-height: 350px;
            overflow-y: auto;
            z-index: 9999;
            display: none;
        }
        .cart-pill {
            position: relative;
            background: #222;
            color: white;
            padding: 8px 12px;
            border-radius: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        #cart-count {
            background: #d63031;
            font-size: 0.7rem;
            min-width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        @keyframes cartBounce {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); background: var(--gold); }
    100% { transform: scale(1); }
}

.cart-bounce {
    animation: cartBounce 0.4s ease-in-out;
}
    </style>
</head>
<body>

    <div id="cart-placeholder"></div>

    <header class="glass-header">
        <div class="header-inner">
            <div class="back-btn" onclick="history.back()"><i class="fas fa-chevron-left"></i></div>
            
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" id="productSearch" placeholder="Search resin products...">
                <div id="searchResults" class="search-results-overlay"></div>
            </div>

            <div class="cart-pill" onclick="toggleCart()">
                <i class="fas fa-shopping-bag"></i>
                <span id="cart-count">0</span>
            </div>
        </div>
    </header>

    <main class="product-container">
        <nav class="breadcrumb" id="breadcrumb"></nav>

        <section class="main-info">
            <div class="image-gallery">
                <div class="main-img-holder">
                    <img id="main-display-img" src="" alt="Product Image">
                </div>
                <div class="thumb-list" id="thumb-list"></div>
            </div>

            <div class="details-pane">
                <div class="brand-line" id="product-brand"></div>
                <h1 class="product-title" id="product-name">Loading...</h1>
                
                <div class="price-box">
                    <span class="sale-price" id="product-sale"></span>
                    <span class="mrp-price" id="product-mrp"></span>
                    <span class="discount-percent" id="product-discount"></span>
                </div>

                <div class="delivery-note">
                    <i class="fas fa-truck"></i> Free Delivery on this item
                </div>

                <div id="attributes-container" class="attr-group"></div>

                <div class="action-buttons-group">
                    <button class="add-to-cart-btn" onclick="handleAddToCart()">
                        <i class="fas fa-shopping-basket"></i> Add to Cart
                    </button>
                    <button class="buy-now-btn" onclick="handleWhatsAppOrder()">
                        <i class="fab fa-whatsapp"></i> Inquiry on WhatsApp
                    </button>
                </div>
            </div>
        </section>

        <section id="kit-section" class="kit-promo-box" style="display: none;">
            <div class="kit-header">
                <i class="fas fa-box-open"></i>
                <span>STARTER KIT AVAILABLE</span>
            </div>
            <p>Includes everything required for this project.</p>
            <button class="add-kit-btn" onclick="openKitModal(currentProduct.id)">
                Check Kit Items & Save
            </button> 
        </section>

        <section class="description-section">
            <h3>Product Description</h3>
            <p id="product-description"></p>
            <div id="other-details" class="technical-specs"></div>
        </section>

        <section class="similar-products-container">
            <div class="section-header">
                <h3>Similar Products</h3>
                <p>Customers also bought</p>
            </div>
            <div id="similar-products-grid" class="resin-grid"></div>
        </section>
    </main>

    <div id="kit-modal" class="modal-overlay" style="display:none;">
        <div class="kit-modal-content">
            <div class="modal-header">
                <h3>Complete the Set</h3>
                <button onclick="closeModal()" class="close-modal">&times;</button>
            </div>
            <div id="kit-items-list"></div> 
            <div id="modal-footer-logic"></div>
        </div>
    </div>

    <script src="../../../database.js"></script>
    <script src="../../../cart.js"></script>
    <script src="product.js"></script> 
</body>
</html>
