<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Resin Cosmos | Category</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../resincosmos.css">
    <link rel="stylesheet" href="category.css">
    <link rel="stylesheet" href="../../../my-account/cart/cart.css">
    <link rel="stylesheet" href="../../../navbar.css">
    <style>
        /* Category Specific Tweaks */
        .category-header { display: flex; align-items: center; gap: 15px; }
        .back-btn { font-size: 1.2rem; cursor: pointer; padding: 5px; }
        .results-count { font-size: 0.8rem; color: #888; margin-bottom: 10px; padding: 0 20px; }
        #category-title { text-transform: uppercase; }
    </style>
</head>
<body>
     


    <header class="glass-header">
        <div class="header-inner">
            <div class="category-header">
                <i class="fas fa-arrow-left back-btn" onclick="history.back()"></i>
                <div class="logo"><span id="category-title">Loading...</span></div>
            </div>
            <div id="auth-status-area">
            <div class="profile-nav-container">
             <a href="../../../my-account/log-in/log-in.html" id="nav-profile-link" class="nav-user-flex">
                <div class="user-meta">
                <small>Hello,</small>
                <strong id="nav-user-name">Sign In</strong>
                </div>
                <div class="../../../profile-badge">
                  <img src="assets/default-user.png" id="nav-user-pic" class="nav-icon">
                </div>
            </a>
           <div id="nav-dropdown" class="nav-dropdown hidden">
            <a href="../../../profile.html?tab=profile" class="drop-item">My Profile</a>
            <a href="../../../profile.html?tab=orders" class="drop-item">My Orders</a>
            <a href="../../../profile.html?tab=shipping" class="drop-item">Shipping Address</a>
            <hr>
            <button id="nav-logout-btn">Sign Out</button>
            </div>
            </div>
</div>

            <div class="cart-nav-container">
                <button id="btn-open-cart" class="nav-icon-btn">
                <i class="fa-solid fa-cart-shopping"></i>
                <span id="cart-count">0</span> </button>
            </div>
        </div>
       <div class="search-bar">
        <i class="fas fa-search"></i>
        <input type="text" id="productSearch" placeholder="Search in this category...">
        <div id="searchResults" class="search-results-overlay"></div>
    </div>
    </header>

    <div id="cart-sidebar-placeholder"></div>

    <main class="responsive-container">
        <div class="results-count" id="item-count"></div>
        <section class="app-section" style="padding-top: 10px;">
            <div class="grid-container expanded" id="category-grid">
                </div>
        </section>
    </main>

    <script type="module" src="../../../my-account/cart/cart-handler.js"></script>
    <script src="../../../my-account/cart/cart-loader.js"></script>
    <script type="module" src="../../../navbar.js"></script>
    <script src="../../../database.js"></script>
    <script src="../../../cart.js"></script>
    <script src="category.js"></script>
</body>
</html>
