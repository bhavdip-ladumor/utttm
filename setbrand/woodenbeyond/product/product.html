<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Product Details | Wooden Beyond</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    
    <link rel="stylesheet" href="product.css">
    <link rel="stylesheet" href="../../../my-account/cart/cart.css">
    <link rel="preconnect" href="https://raw.githubusercontent.com">
    <link rel="stylesheet" href="../../../navbar.css">

</head>

<body>

    <div id="loading-overlay">
    <div class="spinner"></div>
    <p>Loading Wooden Beyond...</p>
</div>
    <header class="main-header">
    
    <div class="nav-row">
        <div class="nav-left">
            <button class="back-btn" onclick="history.back()" aria-label="Go Back">
                <i class="fas fa-chevron-left"></i>
            </button>
            <a href="../woodenbeyond.html" class="brand-logo">Woodenbeyond</a>
        </div>
        
        <div id="auth-status-area">
            <div class="profile-nav-container">
             <a href="../../../my-account/log-in/log-in.html" id="nav-profile-link" class="nav-user-flex">
                <div class="user-meta">
                <small>Hello,</small>
                <strong id="nav-user-name">Sign In</strong>
                </div>
                <div class="profile-badge">
                  <img src="assets/default-user.png" id="nav-user-pic" class="nav-icon">
                </div>
            </a>
           <div id="nav-dropdown" class="nav-dropdown hidden">
            <a href="../../../profile.html?tab=profile" class="drop-item">My Profile</a>
            <a href="../../../profile.html?tab=orders" class="drop-item">My Orders</a>
            <a href="../../../profile.html?tab=shipping" class="drop-item">Shipping Address</a>
            <hr>
            <button id="nav-logout-btn">Sign Out</button>
            </div>
            </div>
</div>


        <div class="nav-right">
            <div class="cart-nav-container">
                <button id="btn-open-cart" class="nav-icon-btn">
                <i class="fa-solid fa-cart-shopping"></i>
                <span id="cart-count">0</span> </button>
            </div>
        </div>
    </div>

    <div class="search-row">
        <div class="search-wrapper">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="productSearch" placeholder="Search for resin, molds, or colors...">
            <div id="searchResults" class="search-dropdown"></div>
        </div>
    </div>
</header>


<div id="cart-sidebar-placeholder"></div>


<nav class="product-nav">
    <div class="nav-left-box">
        <button class="menu-trigger" onclick="toggleSidebar()">
            <i class="fas fa-bars"></i>
        </button>
    </div>

    <div class="nav-center-box">
        <a href="https://uttamhub.com" class="uttam-pill-btn" target="_blank">
            Visit other stores on uttamhub
        </a>
    </div>

    <div class="nav-right-box">
        <a class="home-link" href="../woodenbeyond.html">
            <i class="fas fa-home"></i>
        </a>
    </div>
</nav>

<div id="sidebar-menu" class="sidebar">
    <div class="sidebar-header">
        <h3>Categories</h3>
        <button class="close-btn" onclick="toggleSidebar()">&times;</button>
    </div>
    <div id="sidebar-content"></div>
</div>

<!-- <div id="sidebar-overlay" onclick="toggleSidebar()"></div> -->

<section class="product-gallery">
    <div class="main-image-container">
        <button id="img-share-btn" class="img-share-btn" title="Share Product">
            <i class="fas fa-share-alt"></i>
        </button>

        <img id="main-display-img" src="placeholder.jpg" alt="Active Product Image">
        <span id="image-discount-badge" class="img-badge"></span>
    </div>

    <div class="thumbnail-wrapper">
        <div id="thumb-list" class="thumb-scroll-container"></div>
    </div>
</section>

<section class="product-details">
    <div class="brand-badge" id="product-brand">Loading...</div>
    <h1 class="product-title" id="product-name">Product Name</h1>
    <div class="product-tagline" id="product-tagline"></div>
    <div class="price-row">
        
        <span class="sale-price" id="product-sale">₹0</span>
        <span class="mrp-price" id="product-mrp">₹0</span>
        <span class="discount-percent" id="detail-discount"></span>
        <div id="stock-status" class="stock-status-container"></div>
    </div>

<div class="variant-section">
    <div id="variant-chips" class="chip-container"></div>
</div>

    <div class="delivery-info">
        <div class="info-item" id="free-delivery-tag" style="display: none;">
            <i class="fas fa-truck"></i>
            <span>Free Delivery Available</span>
        </div>
        <div class="info-item">
            <i class="fas fa-shield-alt"></i>
            <span>Quality Assured</span>
        </div>
    </div>

    <div class="cta-buttons">
    <button class="btn-cart" onclick="addToCartSilent(selectedVariant.sku)">
        <i class="fas fa-shopping-bag"></i> Add to Cart
    </button>
    <button class="btn-whatsapp" id="whatsapp-inquiry">
        <i class="fab fa-whatsapp"></i> Inquiry
    </button>
</div>
<div class="product-info-wrapper">
    <div class="info-section">
        <h3 class="info-title">Description</h3>
        <p id="product-description" class="description-text"></p>
    </div>

<div id="other-details-section" class="info-section">
    <h3 class="info-title">Highlights</h3>
    <div class="collapsible-wrapper" id="wrapper-highlights">
        <div id="other-details-list" class="details-list"></div>
        <div class="fade-overlay"></div>
    </div>
    <button class="mini-toggle-btn" onclick="toggleSection('highlights')">Show All</button>
</div>

<div class="info-section">
    <h3 class="info-title">Product Specifications</h3>
    <div class="collapsible-wrapper" id="wrapper-specs">
        <div id="product-specs" class="specs-grid"></div> <div class="fade-overlay"></div>
    </div>
    <button class="mini-toggle-btn" onclick="toggleSection('specs')">Show All</button>
</div>
</div>
</section>

<section class="similar-products">
    <div class="container">
        <h2 class="section-title">You May Also Like</h2>
        <div id="similar-grid" class="similar-grid">
            </div>
    </div>
</section>



<div id="other-categories-area"></div>
        
    <script type="module" src="../../../my-account/cart/cart-handler.js"></script>
    <script src="../../../my-account/cart/cart-loader.js"></script> 
    <script type="module" src="../../../navbar.js"></script>
    <script src="../../../database.js"></script>
    <script src="product.js"></script>
</body>
</html>
