<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Resin Cosmos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="log-in.css">
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            <div class="brand-section">
                <img src="../../assets/logo.png" alt="uttamhub" class="logo-img">
                <h1>Welcome Back</h1>
                <p>Sign in to manage your orders and profile</p>
            </div>

            <button id="google-login-btn" class="google-btn">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" alt="Google">
                <span>Continue with Google</span>
            </button>

            <div class="footer-links">
                <a href="javascript:void(0)" id="back-link">Go Back</a>
            </div>
        </div>
    </div>

    <script type="module" src="log-in.js"></script>
</body>
</html>
