<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Bhavdip's Workshop</title>
    <link rel="stylesheet" href="checkout.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="checkout-container">
        <header class="checkout-header">
              <a href="javascript:void(0);" onclick="goBackToSource()" class="back-link">
             <i class="fa-solid fa-arrow-left"></i> Back to Store
            </a>
            <h1>Secure Checkout</h1>
        </header>

        <form id="checkout-form">
            <section class="form-section">
                <h2><span class="step-num">1</span> Personal Details</h2>
                <div class="row">
                    <div class="field">
                        <label>First Name*</label>
                        <input type="text" id="fname" required placeholder="e.g. Bhavdip">
                    </div>
                    <div class="field">
                        <label>Last Name*</label>
                        <input type="text" id="lname" required placeholder="e.g. Ladumor">
                    </div>
                </div>
                <div class="row">
                    <div class="field">
                        <label>WhatsApp Number*</label>
                        <input type="tel" id="mobile" required placeholder="10-digit mobile number">
                    </div>
                    <div class="field">
                        <label>Email Address</label>
                        <input type="email" id="email" placeholder="for order updates">
                    </div>
                </div>
            </section>

            <section class="form-section">
                <h2><span class="step-num">2</span> Delivery Address</h2>
                <div class="field">
                    <label>Flat/House No. & Building Name*</label>
                    <input type="text" id="address1" required>
                </div>
                <div class="row">
                    <div class="field">
                        <label>Society / Village*</label>
                        <input type="text" id="society">
                    </div>
                    <div class="field">
                        <label>Street Name</label>
                        <input type="text" id="street">
                    </div>
                </div>
                <div class="row">
                    <div class="field">
                        <label>Area / Tahsil*</label>
                        <input type="text" id="area">
                    </div>
                    <div class="field">
                        <label>Landmark</label>
                        <input type="text" id="landmark" placeholder="e.g. Near Temple">
                    </div>
                </div>
                
                <div class="address-grid">
                    <div class="field">
                        <label>Pincode*</label>
                        <input type="number" id="pincode" required placeholder="6-digit code" oninput="fetchLocation(this.value)">
                    </div>
                    <div class="field">
                        <label>City</label>
                        <input type="text" id="city">
                    </div>
                    <div class="field">
                        <label>State</label>
                        <input type="text" id="state">
                    </div>
                </div>

                <div class="field">
                    <label>Other Address Info (Line 1)</label>
                    <input type="text" id="other1">
                </div>
            </section>

            <section class="form-section">
                <h2><span class="step-num">3</span> Special Instructions</h2>
                <div class="field">
                    <label>Custom Note for Artist</label>
                    <textarea id="artist-note" rows="4" placeholder="Mention any specific colors, layouts, or gift messages here..."></textarea>
                </div>
                <div class="field">
                    <label>How did you find us?</label>
                    <select id="discovery-source">
                        <option value="">Select an option</option>
                        <option value="instagram">Instagram</option>
                        <option value="facebook">Facebook</option>
                        <option value="friend">A Friend</option>
                        <option value="other">Other</option>
                    </select>
                </div>
            </section>

            <button type="submit" class="btn-checkout-final">
                Continue to Order <i class="fa-solid fa-chevron-right"></i>
            </button>
        </form>
    </div>

    <div id="trust-modal" class="modal">
        <div class="modal-content">
        <div class="modal-header">
            <i class="fa-solid fa-circle-check" style="color: #28a745; font-size: 3rem; margin-bottom: 15px;"></i>
            <h3>Details Saved Successfully!</h3>
        </div>
        
        <p class="modal-text">
            To ensure your custom items are crafted exactly as you want, we finalize all orders personally via WhatsApp. 
            <strong>This is safer and faster than standard automated shipping.</strong>
        </p>

        <button id="whatsapp-redirect-btn" class="btn-whatsapp">
            <i class="fa-brands fa-whatsapp"></i> Finalize on WhatsApp
        </button>

        <!-- <button type="button" class="btn-modal-back" onclick="closeTrustModal()">
            <i class="fa-solid fa-pen-to-square"></i> Edit Order Details
        </button> -->
        </div>
    </div>
   <script type="module" src="checkout-controller.js"></script>
   <script type="module" src="order-service.js"></script>
      
</body>
</html>
