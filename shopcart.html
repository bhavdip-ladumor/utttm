

<div id="cart-sidebar" class="cart-sidebar">
    <div class="cart-header">
        <h2>Your Selections</h2>
        <button class="close-sidebar" onclick="toggleCart()">✕</button>
    </div>
    
    <div id="cart-items-container"></div>

    <div class="cart-footer">
        <div class="total-row">
            <span>Subtotal:</span>
            <span>₹<span id="cart-total-amount">0</span></span>
        </div>
        <button class="btn-whatsapp" onclick="checkoutWhatsApp()">
            Confirm Order on WhatsApp
        </button>
        <button class="btn-clear-all" onclick="clearCart()">Clear All</button>
    </div>
</div>

<div id="cart-overlay" onclick="toggleCart()"></div>

<div id="kit-modal" class="modal-overlay" style="display:none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Special Bundle Pack</h3>
            <button onclick="closeModal()">✕</button>
        </div>
        <div id="kit-items-list"></div>
        <div id="modal-footer-logic"></div>
    </div>
</div>
